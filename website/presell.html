<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMind</title>
    <meta name="description" content="Encontre seu equilíbrio.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .presell-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            background: radial-gradient(circle at center, rgba(139, 111, 243, 0.1) 0%, transparent 70%);
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            margin: 0 0 1.5rem;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            max-width: 900px;
        }

        .presell-subtitle {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            color: #9CA3AF;
            max-width: 700px;
            margin: 0 auto 3rem;
            line-height: 1.6;
            font-weight: 300;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .cta-button {
            background: linear-gradient(135deg, #8B6FF3 0%, #7C3AED 100%);
            color: white;
            text-decoration: none;
            padding: 1.25rem 3rem;
            border-radius: 50px;
            font-size: 1.25rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 30px rgba(139, 111, 243, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(139, 111, 243, 0.6);
        }

        .trust-badges {
            display: flex;
            gap: 2rem;
            color: #6B7280;
            font-size: 0.95rem;
            align-items: center;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .trust-icon {
            color: #10B981;
            font-size: 1.2rem;
        }

        footer {
            padding: 3rem 1rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            color: #6B7280;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
        }

        footer a {
            color: #9CA3AF;
            text-decoration: none;
            margin: 0 0.5rem;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #8B6FF3;
        }

        /* Dropdown Styles */
        .lang-dropdown-container {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 10;
        }

        select.lang-select {
            background: rgba(255, 255, 255, 0.05);
            color: #9CA3AF;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            outline: none;
            font-size: 0.9rem;
            transition: border 0.3s;
        }

        select.lang-select:hover {
            border-color: rgba(139, 111, 243, 0.4);
            color: #D1D5DB;
        }

        select.lang-select option {
            background-color: #0d1117;
            color: #fff;
        }

        @media (max-width: 600px) {
            .lang-dropdown-container {
                top: 1.5rem;
                right: 1.5rem;
            }

            .presell-hero {
                padding: 5rem 1.5rem;
            }

            .trust-badges {
                flex-direction: column;
                gap: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="lang-dropdown-container">
        <select class="lang-select" onchange="changeLang(this.value)" id="langSelect">
            <option value="pt-BR">Português</option>
            <option value="en">English</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div class="presell-hero">
        <!-- Minimal Content - NO Timer -->
        <h1 data-i18n="presell.title">Organização Simples Para o Seu Dia a Dia</h1>
        <p class="presell-subtitle" data-i18n="presell.subtitle">Descubra ferramentas digitais práticas para planejar
            sua rotina com mais clareza e eficiência.</p>

        <!-- CTA & Trust -->
        <div class="cta-container">
            <a href="https://easemind.io" class="cta-button">
                <span data-i18n="presell.cta">Ir para o Site Oficial</span>
                <span>&rarr;</span>
            </a>

            <div class="trust-badges">
                <div class="trust-item">
                    <span class="trust-icon">🔒</span>
                    <span data-i18n="presell.secure">Ambiente Seguro</span>
                </div>
                <div class="trust-item">
                    <span class="trust-icon">✅</span>
                    <span data-i18n="presell.verified">Verificado Oficial</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 EaseMind</p>
        <p>
            <a href="/privacy" data-i18n="footer.privacy">Privacidade</a> •
            <a href="/terms" data-i18n="footer.terms">Termos</a>
        </p>
    </footer>

    <script>
        // --- Translation Logic ---
        let currentLang = 'pt-BR';
        let translations = {};

        function detectLanguageFromURL() {
            const path = window.location.pathname;
            if (path.includes('/en/')) return 'en';
            if (path.includes('/es/')) return 'es';
            return 'pt-BR';
        }

        async function loadTranslations(lang) {
            try {
                const response = await fetch(`/locales/${lang}.json`);
                const data = await response.json();
                translations = data;
                applyTranslations();
                const selectInfo = document.getElementById('langSelect');
                if (selectInfo) selectInfo.value = lang;
            } catch (error) {
                console.error('Error translations:', error);
            }
        }

        function applyTranslations() {
            // Update HTML lang attribute
            document.documentElement.lang = currentLang;

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                const keys = key.split('.');
                let value = translations;
                for (const k of keys) value = value?.[k];
                if (value) element.textContent = value;
            });
        }

        function changeLang(lang) {
            const langPaths = { 'pt-BR': '/pt/pre-venda', 'en': '/en/presell', 'es': '/es/pre-venta' };
            window.location.href = langPaths[lang] || '/pre-venda';
        }

        document.addEventListener('DOMContentLoaded', () => {
            currentLang = detectLanguageFromURL();
            loadTranslations(currentLang);
        });
    </script>
</body>

</html>
